<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskAcademy — Admin Dashboard</title>
<link rel="stylesheet" href="../css/tailwind.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<!-- Firebase App (the core Firebase SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<style>
  :root {
    --bg: #0f1117; --bg2: #171b26; --bg3: #1e2233; --border: #2a2f45;
    --text: #e8eaf6; --text2: #8b90a7; --accent: #4fc3f7; --accent2: #6c63ff;
    --green: #4ade80; --amber: #fbbf24; --red: #f87171; --pink: #f472b6;
    --card-bg: #171b26; --badge-bg: #252a3d;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
  .mono { font-family: 'Space Mono', monospace; }
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; }
  
  /* Premium Stat Cards */
  .stat-card { position: relative; overflow: hidden; }
  .stat-card::before { content: ''; position: absolute; top: 0; right: 0; width: 60px; height: 60px; border-radius: 0 0 0 60px; opacity: .08; }
  .stat-card.blue::before { background: var(--accent); }
  .stat-card.purple::before { background: var(--accent2); }
  .stat-card.green::before { background: var(--green); }
  .stat-card.amber::before { background: var(--amber); }

  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 13px; color: var(--text2); cursor: pointer; border-left: 2px solid transparent; transition: all .15s; }
  .nav-item:hover { color: var(--text); background: var(--bg3); }
  .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(79,195,247,.08); }
  
  input, select, textarea { background: var(--bg3); border: 1px solid rgba(255,255,255,0.1); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 13px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  
  .btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
  .btn-primary { background: var(--accent); color: #0f1117; }
  .btn-primary:hover { background: #38b2f0; }
  .btn-danger { background: rgba(248,113,113,.2); color: var(--red); border: 1px solid rgba(248,113,113,.3); }
  .modal-bg { background: rgba(0,0,0,.7); }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; }
  .p-high { background: rgba(248,113,113,.15); color: var(--red); }
  .p-med  { background: rgba(251,191,36,.15);  color: var(--amber); }
  .p-low  { background: rgba(74,222,128,.15);  color: var(--green); }

  /* Mobile Responsive Sidebar */
  @media (max-width: 1024px) {
    .sidebar {
      position: fixed;
      left: -100%;
      top: 0;
      bottom: 0;
      z-index: 50;
      transition: left 0.3s ease;
      width: 280px;
    }
    .sidebar.active {
      left: 0;
    }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 40;
    }
    .sidebar-overlay.active {
      display: block;
    }
  }

  /* Two Column Layout */
  .two-col { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
  @media (max-width: 1280px) {
    .two-col { grid-template-columns: 1fr; }
  }

  /* Widget Header Styling */
  .card-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

  .card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text2); }
  .card-action { font-size: 10px; color: var(--accent); cursor: pointer; font-weight: 600; }
  .card-action:hover { text-decoration: underline; }

  /* Activity Feed Styles */
  .activity-item { display: flex; gap: 12px; padding: 12px 16px; transition: background 0.2s; }
  .activity-item:hover { background: var(--bg3); }
  .activity-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  .activity-content { flex: 1; }
  .activity-title { font-size: 12px; font-weight: 500; color: var(--text); }
  .activity-meta { font-size: 10px; color: var(--text2); margin-top: 2px; }

</head>
<body class="flex h-screen overflow-hidden">

<!-- Sidebar Overlay -->
<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<div id="mainSidebar" class="sidebar w-64 bg-gray-900 border-r border-gray-800 flex flex-col flex-shrink-0">
  <div class="p-5 border-b border-gray-800 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <img src="../assets/favicon.svg" class="w-8 h-8 rounded-lg shadow-lg shadow-purple-500/20" alt="TA">
      <div>
        <div class="mono text-sm font-bold text-white">TaskAcademy</div>
        <div class="text-[10px] text-gray-500 tracking-widest uppercase">Admin Panel</div>
      </div>
    </div>
    <button onclick="toggleSidebar()" class="lg:hidden text-gray-400 hover:text-white">✕</button>
  </div>
  <nav class="flex-1 py-3 overflow-y-auto">
    <div class="nav-item active" onclick="showPage('overview')">📊 Overview</div>
    <div class="nav-item" onclick="showPage('tasks')">📋 Manage Tasks</div>
    <div class="nav-item" onclick="showPage('students')">👨‍🎓 Students</div>
    <div class="nav-item" onclick="showPage('groups')">👥 Groups</div>
    <div class="nav-item" onclick="showPage('analytics')">📈 Analytics</div>
  </nav>
  <div class="p-3 border-t border-gray-800 flex items-center gap-2 cursor-pointer hover:bg-gray-800/20 transition-colors" onclick="showPage('profile')">
    <div id="adminAvatar" class="w-8 h-8 rounded-full bg-blue-900 flex items-center justify-center text-xs font-bold text-blue-300 flex-shrink-0"></div>
    <div class="min-w-0">
      <div id="adminName" class="text-xs font-medium truncate"></div>
      <div class="text-[10px] text-gray-500">System Administrator</div>
    </div>
    <button onclick="event.stopPropagation(); logout()" class="ml-auto text-xs text-gray-600 hover:text-red-400">⏏</button>
  </div>
</div>


<!-- Main -->
<div class="flex-1 overflow-y-auto flex flex-col">
  <!-- Topbar removed per request -->

  <div class="flex-1 p-6">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-4">
        <button onclick="toggleSidebar()" class="lg:hidden text-gray-400 hover:text-white text-xl">☰</button>
        <h1 id="pageTitle" class="text-2xl font-bold text-white">Overview</h1>
      </div>
      <button onclick="openCreateTask()" class="btn btn-primary text-xs">+ Create Task</button>
    </div>

    <!-- OVERVIEW -->
    <div id="page-overview">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <div class="card stat-card blue p-4"><div class="text-xs text-gray-400 uppercase tracking-wide mb-1">Students</div><div id="stat-students" class="mono text-2xl text-blue-300">—</div></div>
        <div class="card stat-card purple p-4"><div class="text-xs text-gray-400 uppercase tracking-wide mb-1">Total Tasks</div><div id="stat-tasks" class="mono text-2xl text-purple-400">—</div></div>
        <div class="card stat-card green p-4"><div class="text-xs text-gray-400 uppercase tracking-wide mb-1">Completed</div><div id="stat-done" class="mono text-2xl text-green-400">—</div></div>
        <div class="card stat-card amber p-4"><div class="text-xs text-gray-400 uppercase tracking-wide mb-1">Completion Rate</div><div id="stat-rate" class="mono text-2xl text-yellow-400">—</div></div>
      </div>

      <div class="two-col">
        <!-- Main Column -->
        <div class="flex flex-col gap-4">
          <div class="card p-4">
            <div class="text-sm font-semibold mb-3">Tasks by Priority</div>
            <div class="h-64">
              <canvas id="priorityChart"></canvas>
            </div>
          </div>
          <div class="card p-4">
            <div class="text-sm font-semibold mb-3">Top Performers</div>
            <div id="topPerformers"></div>
          </div>
        </div>

        <!-- Side Column -->
        <div class="flex flex-col gap-4">
          <!-- Recent Activity Widget -->
          <div class="card overflow-hidden">
            <div class="card-header">
              <span class="card-title">Recent Activity</span>
              <span class="card-action">View Log</span>
            </div>
            <div id="adminRecentActivity" class="divide-y divide-gray-800/50">
              <div class="p-4 text-xs text-gray-500 text-center">Loading activity...</div>
            </div>
          </div>

          <!-- System Status Widget -->
          <div class="card p-4">
            <div class="text-xs text-gray-500 uppercase tracking-widest mb-3">System Status</div>
            <div class="space-y-3">
              <div class="flex justify-between items-center text-xs">
                <span>API Server</span>
                <span class="text-green-400 flex items-center gap-1"><span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> Online</span>
              </div>
              <div class="flex justify-between items-center text-xs">
                <span>Database</span>
                <span class="text-green-400 flex items-center gap-1"><span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> Stable</span>
              </div>
              <div class="flex justify-between items-center text-xs">
                <span>Storage</span>
                <span class="text-blue-300">82% Used</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>


    <!-- TASKS -->
    <div id="page-tasks" class="hidden">
      <div id="adminTasksList" class="space-y-2">Loading...</div>
    </div>

    <!-- STUDENTS -->
    <div id="page-students" class="hidden">
      <div id="studentsList" class="space-y-2">Loading...</div>
    </div>

    <!-- GROUPS -->
    <div id="page-groups" class="hidden">
      <button onclick="openCreateGroup()" class="btn btn-primary mb-4 text-xs">+ Create Group</button>
      <div id="adminGroupsList" class="grid grid-cols-2 gap-4">Loading...</div>
    </div>

    <!-- ANALYTICS -->
    <div id="page-analytics" class="hidden">
      <div class="card p-4 mb-4">
        <div class="text-sm font-semibold mb-3">Weekly Task Creation</div>
        <canvas id="weeklyChart" height="120"></canvas>
      </div>
    </div>

    <!-- PROFILE -->
    <div id="page-profile" class="hidden">
      <div class="max-w-md mx-auto space-y-6">
        <div class="card p-6 text-center">
          <div id="adminProfileAvatar" class="w-20 h-20 rounded-full bg-blue-900 mx-auto flex items-center justify-center text-2xl font-bold text-blue-300 mb-4 border-2 border-blue-400/20 shadow-xl shadow-blue-500/10"></div>
          <h2 id="adminProfileName" class="text-xl font-bold">Admin</h2>
          <p id="adminProfileEmail" class="text-sm text-gray-500">admin@taskacademy.com</p>
        </div>
        
        <div class="card p-6">
          <h3 class="font-semibold mb-4 text-sm">Update Profile</h3>
          <div class="space-y-4">
            <div>
              <label class="block text-xs text-gray-500 mb-1 ml-1">Display Name</label>
              <input id="editAdminName" placeholder="Your Name" />
            </div>
            <button onclick="updateAdminProfile()" class="btn btn-primary w-full">Save Changes</button>
          </div>
        </div>

        <div class="card p-6 bg-red-900/10 border-red-900/30">
          <h3 class="font-semibold mb-2 text-sm text-red-400">Danger Zone</h3>
          <p class="text-xs text-gray-500 mb-4">Once you delete your account, there is no going back. Please be certain.</p>
          <button onclick="logout()" class="btn btn-danger w-full">Logout from System</button>
        </div>
      </div>
    </div>


  </div>
</div>

<!-- Create Task Modal -->
<div id="createTaskModal" class="hidden fixed inset-0 modal-bg z-30 flex items-center justify-center p-4">
  <div class="card p-6 w-full max-w-lg">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-semibold">Create New Task</h3>
      <button onclick="closeModals()" class="text-gray-400 hover:text-white">✕</button>
    </div>
    <div class="space-y-3">
      <input id="taskTitle" placeholder="Task title *" />
      <textarea id="taskDesc" placeholder="Description" rows="3"></textarea>
      <div class="grid grid-cols-2 gap-3">
        <select id="taskPriority">
          <option value="medium">Priority: Medium</option>
          <option value="high">Priority: High</option>
          <option value="low">Priority: Low</option>
        </select>
        <input id="taskDeadline" type="datetime-local" />
      </div>
      <select id="taskAssignTo"><option value="">Assign to student...</option></select>
      <input id="taskXP" type="number" placeholder="XP Reward (default 50)" value="50" />
      <div id="createTaskError" class="text-red-400 text-xs hidden"></div>
      <div class="flex gap-2 justify-end">
        <button onclick="closeModals()" class="btn btn-ghost">Cancel</button>
        <button onclick="createTask()" class="btn btn-primary">Create Task</button>
      </div>
    </div>
  </div>
</div>

<!-- Create Group Modal -->
<div id="createGroupModal" class="hidden fixed inset-0 modal-bg z-30 flex items-center justify-center p-4">
  <div class="card p-6 w-full max-w-md">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-semibold">Create Group</h3>
      <button onclick="closeModals()" class="text-gray-400 hover:text-white">✕</button>
    </div>
    <div class="space-y-3">
      <input id="groupName" placeholder="Group name *" />
      <textarea id="groupDesc" placeholder="Description" rows="2"></textarea>
      <button onclick="createGroup()" class="btn btn-primary w-full">Create Group</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
let adminUser = null;
requireAuth('admin', (user) => {
  adminUser = user;
  
  document.getElementById('adminAvatar').textContent = adminUser.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('adminName').textContent = adminUser.name;
  
  loadOverview();
});

let studentCache = [];

const pages = ['overview','tasks','students','groups','analytics','profile'];
function showPage(name) {
  pages.forEach(p => {
    const el = document.getElementById(`page-${p}`);
    if(el) el.classList.add('hidden');
  });
  const pageEl = document.getElementById(`page-${name}`);
  if(pageEl) pageEl.classList.remove('hidden');
  
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event?.currentTarget?.classList.add('active');
  document.getElementById('pageTitle').textContent = name.charAt(0).toUpperCase() + name.slice(1);

  if (name === 'tasks')     loadAdminTasks();
  if (name === 'students')  loadStudents();
  if (name === 'groups')    loadAdminGroups();
  if (name === 'analytics') loadAnalytics();
  if (name === 'profile')   loadAdminProfile();

  if (window.innerWidth < 1024) toggleSidebar();
}

async function loadAdminProfile() {
  const user = firebase.auth().currentUser;
  if(!user) return;
  
  const initials = user.displayName.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('adminProfileAvatar').textContent = initials;
  document.getElementById('adminProfileName').textContent = user.displayName;
  document.getElementById('adminProfileEmail').textContent = user.email;
  document.getElementById('editAdminName').value = user.displayName;
}

async function updateAdminProfile() {
  const newName = document.getElementById('editAdminName').value.trim();
  if (!newName) return alert("Please enter a name");

  try {
    const user = firebase.auth().currentUser;
    await user.updateProfile({ displayName: newName });
    await db.collection('users').doc(user.uid).update({ name: newName });
    alert("Admin profile updated!");
    location.reload();
  } catch (err) {
    console.error(err);
    alert("Error updating profile");
  }
}

function toggleSidebar() {
  const sidebar = document.getElementById('mainSidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (sidebar && overlay) {
    sidebar.classList.toggle('active');
    overlay.classList.toggle('active');
  }
}

// ── Overview ───────────────────────────────────────────────
async function loadOverview() {
  const data = await API.getOverview();
  if (!data?.success) return;
  const d = data.data;

  document.getElementById('stat-students').textContent = d.totalUsers;
  document.getElementById('stat-tasks').textContent    = d.totalTasks;
  document.getElementById('stat-done').textContent     = d.completedTasks;
  document.getElementById('stat-rate').textContent     = d.completionRate + '%';

  const performers = document.getElementById('topPerformers');
  if (d.completionByUser.length === 0) {
    performers.innerHTML = '<div class="text-xs text-gray-500 py-4 text-center">No student data yet.</div>';
  } else {
    performers.innerHTML = d.completionByUser.slice(0,5).map((u, i) => `
      <div class="flex items-center gap-3 py-2 border-b border-gray-800 text-sm">
        <span class="text-gray-500 w-5 font-mono text-[10px]">${i+1}</span>
        <div class="w-7 h-7 rounded-full bg-gray-800 flex items-center justify-center text-[10px] text-gray-400 font-bold">${u.name.charAt(0)}</div>
        <span class="flex-1">${u.name}</span>
        <span class="text-green-400 text-xs mono font-bold">${u.completed} done</span>
      </div>
    `).join('');
  }

  renderAdminActivity();

  const ctx = document.getElementById('priorityChart').getContext('2d');
  const priorities = ['high','medium','low'];
  const counts = priorities.map(p => d.tasksByPriority.find(x=>x.priority===p)?.count || 0);
  
  if (window.adminPriorityChart) window.adminPriorityChart.destroy();
  window.adminPriorityChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['High', 'Medium', 'Low'],
      datasets: [{ 
        label: 'Tasks',
        data: counts, 
        backgroundColor: ['#f87171','#fbbf24','#4ade80'], 
        borderRadius: 8,
        barThickness: 32
      }]
    },
    options: { 
      responsive: true, 
      maintainAspectRatio: false,
      plugins: { legend: { display: false } }, 
      scales: { 
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8b90a7', font: { size: 10 } } }, 
        x: { grid: { display: false }, ticks: { color: '#8b90a7', font: { size: 10 } } } 
      } 
    }
  });
}

function renderAdminActivity() {
  const container = document.getElementById('adminRecentActivity');
  // Mocking activity since we don't have a global log yet
  const activities = [
    { type: 'task', title: 'New Task Created', student: 'Web Dev Project', time: '2m ago', color: 'var(--accent2)' },
    { type: 'student', title: 'Student Joined', student: 'Sarah Connor', time: '15m ago', color: 'var(--green)' },
    { type: 'completion', title: 'Task Completed', student: 'John Doe', time: '1h ago', color: 'var(--amber)' }
  ];

  container.innerHTML = activities.map(a => `
    <div class="activity-item">
      <div class="activity-dot" style="background:${a.color}"></div>
      <div class="activity-content">
        <div class="activity-title">${a.title}</div>
        <div class="activity-meta">${a.student} • ${a.time}</div>
      </div>
    </div>
  `).join('');
}


// ── Admin Tasks ────────────────────────────────────────────
async function loadAdminTasks() {
  const data = await API.getTasks();
  if (!data?.success) return;
  document.getElementById('adminTasksList').innerHTML = data.data.length === 0
    ? '<p class="text-gray-500 text-sm">No tasks yet. Create one!</p>'
    : data.data.map(t => `
      <div class="card p-4 flex items-center gap-4 hover:border-gray-600 transition-colors">
        <div class="w-10 h-10 rounded-xl bg-gray-800 flex items-center justify-center text-xl">📋</div>
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-sm text-white">${t.title}</div>
          <div class="text-xs text-gray-500 mt-1 flex items-center gap-2">
            <span>👤 ${t.assigned_to_name || 'Unassigned'}</span>
            <span>•</span>
            <span>📅 ${formatDate(t.deadline)}</span>
          </div>
        </div>
        <div class="flex items-center gap-3">
          ${priorityBadge(t.priority)}
          ${statusBadge(t.status)}
          <button onclick="deleteTask(${t.id})" class="w-8 h-8 rounded-lg bg-red-500/10 text-red-400 flex items-center justify-center hover:bg-red-500 hover:text-white transition-all">✕</button>
        </div>
      </div>
    `).join('');
}

async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  const data = await API.delete(`/tasks/${id}`);
  if (data?.success) loadAdminTasks();
}

// ── Students ───────────────────────────────────────────────
async function loadStudents() {
  const data = await API.get('/users');
  if (!data?.success) return;
  studentCache = data.data;
  document.getElementById('studentsList').innerHTML = data.data.map(u => `
    <div class="card p-4 flex items-center gap-4 hover:border-gray-600 transition-colors">
      <div class="w-12 h-12 rounded-full bg-gradient-to-br from-purple-500/20 to-blue-500/20 border border-purple-500/30 flex items-center justify-center text-sm font-bold text-white flex-shrink-0 shadow-lg shadow-purple-500/10">
        ${u.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
      </div>
      <div class="flex-1">
        <div class="text-sm font-semibold text-white">${u.name}</div>
        <div class="text-xs text-gray-500 mt-0.5">${u.email}</div>
      </div>
      <div class="text-right flex flex-col items-end gap-1">
        <div class="text-xs font-bold text-yellow-400 mono px-2 py-0.5 bg-yellow-400/10 rounded-full border border-yellow-400/20">${u.xp_points} XP</div>
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full ${u.is_active ? 'bg-green-400 shadow-[0_0_8px_rgba(74,222,128,0.5)]' : 'bg-red-400'}"></span>
          <span class="text-[10px] uppercase tracking-wider ${u.is_active ? 'text-green-400' : 'text-red-400'} font-bold">${u.is_active ? 'Active' : 'Disabled'}</span>
        </div>
      </div>
      <button onclick="toggleStudent(${u.id})" class="btn bg-gray-800 border border-gray-700 text-gray-400 hover:text-white text-xs py-1.5 px-3">Manage</button>
    </div>
  `).join('');
}

async function toggleStudent(id) {
  await API.put(`/users/${id}/toggle`);
  loadStudents();
}

// ── Groups ─────────────────────────────────────────────────
async function loadAdminGroups() {
  const data = await API.getGroups();
  if (!data?.success) return;
  document.getElementById('adminGroupsList').innerHTML = data.data.length === 0
    ? '<p class="text-gray-500 text-sm">No groups yet.</p>'
    : data.data.map(g => `
      <div class="card p-4">
        <div class="font-medium text-sm mb-1">👥 ${g.name}</div>
        <div class="text-xs text-gray-500">${g.description || ''}</div>
        <div class="text-xs text-gray-600 mt-2">${g.member_count} members</div>
      </div>
    `).join('');
}

// ── Analytics ──────────────────────────────────────────────
async function loadAnalytics() {
  const data = await API.getOverview();
  if (!data?.success) return;
  const ctx = document.getElementById('weeklyChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.data.weeklyTasks.map(w => w.day),
      datasets: [{ label: 'Tasks Created', data: data.data.weeklyTasks.map(w => w.count), borderColor: '#6c63ff', backgroundColor: 'rgba(108,99,255,.1)', fill: true, tension: 0.4 }]
    },
    options: { responsive: true, plugins: { legend: { labels: { color: '#9ca3af' } } }, scales: { y: { ticks: { color: '#9ca3af' } }, x: { ticks: { color: '#9ca3af' } } } }
  });
}

// ── Create Task ────────────────────────────────────────────
function openCreateTask() {
  populateStudentSelect();
  document.getElementById('createTaskModal').classList.remove('hidden');
}

async function populateStudentSelect() {
  if (studentCache.length === 0) { const d = await API.get('/users'); if (d?.success) studentCache = d.data; }
  document.getElementById('taskAssignTo').innerHTML = `<option value="">Assign to student...</option>` +
    studentCache.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
}

async function createTask() {
  const title    = document.getElementById('taskTitle').value.trim();
  const desc     = document.getElementById('taskDesc').value.trim();
  const priority = document.getElementById('taskPriority').value;
  const deadline = document.getElementById('taskDeadline').value;
  const assigned = document.getElementById('taskAssignTo').value;
  const xp       = document.getElementById('taskXP').value || 50;
  const errEl    = document.getElementById('createTaskError');

  if (!title || !deadline) { errEl.textContent = 'Title and deadline are required.'; errEl.classList.remove('hidden'); return; }
  errEl.classList.add('hidden');

  const data = await API.post('/tasks', { title, description: desc, priority, deadline, assigned_to: assigned || null, xp_reward: parseInt(xp) });
  if (data?.success) { closeModals(); loadAdminTasks(); alert('Task created successfully!'); }
  else { errEl.textContent = data?.message || 'Failed to create task'; errEl.classList.remove('hidden'); }
}

// ── Create Group ───────────────────────────────────────────
function openCreateGroup() { document.getElementById('createGroupModal').classList.remove('hidden'); }
async function createGroup() {
  const name = document.getElementById('groupName').value.trim();
  const desc = document.getElementById('groupDesc').value.trim();
  if (!name) { alert('Group name required'); return; }
  const data = await API.post('/groups', { name, description: desc });
  if (data?.success) { closeModals(); loadAdminGroups(); }
}

function closeModals() {
  document.getElementById('createTaskModal').classList.add('hidden');
  document.getElementById('createGroupModal').classList.add('hidden');
}

// Initialization now happens inside requireAuth callback
</script>
